# Weekly restore drill — proves the nightly pg_dump actually RESTORES
# (docs: production-readiness audit Batch C, "no restore has been rehearsed").
#
# scripts/restore-drill.mjs downloads the newest db_dumps artifact from B2,
# verifies SHA-256 + size, re-runs the migration manifest gate, restores into
# the throwaway Postgres service below, then asserts migration coverage,
# row-count floors and (when SUPABASE_DB_URL is set) restored <= live.
#
# Needs repo secrets: NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# SUPABASE_DB_URL (optional but enables the live comparison),
# B2_ENDPOINT, B2_KEY_ID, B2_APPLICATION_KEY, B2_BACKUP_BUCKET.
# Missing secrets exit 2 with a named error (fail-closed).

name: Restore drill

on:
  schedule:
    - cron: "0 5 * * 0"   # Sundays 05:00 UTC — weekly rehearsal
  workflow_dispatch:

permissions: {}

jobs:
  drill:
    name: Restore latest dump → temp Postgres → assertions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure pg_restore is available
        run: command -v pg_restore >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Run restore drill
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BACKUP_BUCKET: ${{ secrets.B2_BACKUP_BUCKET }}
          RESTORE_DB_URL: postgresql://postgres:postgres@localhost:54329/postgres
        run: node scripts/restore-drill.mjs
