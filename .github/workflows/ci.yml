name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quality gate — types, lint, bare-hrefs, sitemap, migrations, tests, build
    runs-on: ubuntu-latest
    env:
      # Real secrets when configured (empty on forks / when not set up) — these
      # enable the optional live checks below. The build step overrides the
      # Supabase vars with dummies so the build never touches a real backend.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (engines: >=22 <23)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # P2 — dependency vulnerability scan. Advisory (continue-on-error) so a
      # new transitive advisory doesn't block merges on its own; Dependabot
      # opens the PRs, this step surfaces the findings in the run log.
      - name: Dependency audit (npm audit — advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      # Phase 5.2 — bare-href and sitemap route verification as explicit CI
      # steps (they also run inside `npm run check` locally; split out here so
      # a red step names its exact cause).
      - name: Bare-href audit (no locale-less internal links)
        run: node scripts/find-bare-hrefs.mjs

      # Same pattern for media: editorial images must render via SmartImage,
      # never CSS backgroundImage (raw master bytes on every device).
      - name: Background-image audit (no CSS-background media)
        run: node scripts/find-bg-images.mjs

      - name: Sitemap route verification (static paths + dynamic segments)
        run: node scripts/verify-sitemap.mjs

      # Phase 5.1 — migration manifest gate (names, order, empty files).
      - name: Migration manifest verification
        run: node scripts/verify-migrations.mjs

      # Audit §1.2 — the Hostinger target cannot fire vercel.json crons, so
      # .github/workflows/scheduled-jobs.yml is the real scheduler. Guards the
      # class of bug where an endpoint is deployed but never scheduled (how
      # /api/cron/reminders silently stopped firing) and duplicate job gates.
      - name: Cron manifest verification (vercel.json ⇄ scheduled-jobs.yml)
        run: node scripts/verify-crons.mjs

      # Audit — a module-level `'use server'` file may only export async
      # functions. A sync export breaks `next build` ("Server Actions must be
      # async functions") and is invisible to tsc/eslint/vitest, so it needs a
      # dedicated gate instead of waiting for the build to fail.
      - name: Server Action export verification
        run: node scripts/verify-server-actions.mjs

      # EEAD-002 item 15 — consolidated production security posture (anon
      # bundle + service-role gate, server actions, migrations, crons,
      # sitemap, data_requests RLS regression). `npm run verify:posture`
      # locally runs the same script.
      - name: Security posture verification (EEAD-002)
        run: npm run verify:posture

      # Phase 5.1 — audit §6.1's `supabase db lint`. Needs a live database, so
      # it runs only when the SUPABASE_DB_URL secret is configured; otherwise
      # the run skips with a notice instead of failing.
      - name: Supabase migration lint (requires SUPABASE_DB_URL secret)
        if: env.SUPABASE_DB_URL != ''
        run: npx --yes supabase@latest db lint --db-url "$SUPABASE_DB_URL"

      - name: Migration lint skipped (SUPABASE_DB_URL secret not configured)
        if: env.SUPABASE_DB_URL == ''
        run: echo "SUPABASE_DB_URL secret not set — 'supabase db lint' skipped. Add the repo secret to enable live migration linting."

      # A6 — schema-drift gate. Regenerates lib/supabase/database.types.ts from
      # the migration DDL + the live PostgREST description and fails when the
      # committed file differs. Needs the Supabase URL + service key; skipped
      # (with a notice) on forks that have no secrets.
      - name: Generated database types verification (requires Supabase secrets)
        if: env.NEXT_PUBLIC_SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run verify:types

      - name: Generated database types skipped (Supabase secrets not configured)
        if: env.NEXT_PUBLIC_SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == ''
        run: echo "Supabase URL/service key not set — generated-type drift check skipped."

      # W17 — schema lint (plpgsql bodies, unused objects, RPC types) needs a DB
      # connection, so it is enforced only where the secret exists. Without it
      # scripts/verify-db-lint.mjs prints an explicit skip and exits 0.
      - name: Supabase DB lint (requires SUPABASE_DB_URL, else skipped)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run verify:db-lint

      # Phase 5.3 — the vitest suite includes lib/i18n/parity.test.ts, the
      # automated EN/FR edge-case matrix: dictionary key parity at every depth,
      # no empty/whitespace strings, equal array lengths, two-locale sitemap
      # emission with full hreflang alternates, and buildAlternates coverage.
      - name: Unit tests + EN/FR locale matrix (vitest)
        run: npm test

      # Phase 5.1 — production build dry-run. Dummy envs keep every guarded
      # query on its no-database fallback path so no real service is touched.
      - name: Dry-run production build (next build)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: 'https://preview.eagleeyeafrica.com'
          NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'test-anon-key'
          SUPABASE_SERVICE_ROLE_KEY: 'test-service-role-key'

      # Phase 3.2 follow-through — live backup verification when storage
      # secrets exist. Advisory (continue-on-error) so a transient storage
      # hiccup doesn't block merges; skipped cleanly when secrets are absent
      # (scripts/verify-backup.mjs exits 2 without Supabase env).
      - name: Backup integrity verification (requires storage secrets)
        if: env.NEXT_PUBLIC_SUPABASE_URL != '' && env.R2_ACCOUNT_ID != ''
        run: node scripts/verify-backup.mjs --mode=verify --batch=10
        continue-on-error: true

  # W3 (audit D3) — behavioral RLS invariants against the REAL migration chain.
  # This is the only automated coverage of the defense-in-depth data layer; a
  # dropped/widened policy fails the build (proven by negative test: dropping
  # "Own/reviewable submissions" turns the suite red).
  rls-invariants:
    name: RLS invariants — migration chain + policy behavior
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (engines: >=22 <23)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply harness stubs + all migrations, assert structural gates, run behavioral invariants
        run: npm run test:rls
        env:
          RLS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:54329/postgres

      # Phase 5.1 — production build dry-run. Dummy envs keep every guarded
      # query on its no-database fallback path so no real service is touched.
      - name: Dry-run production build (next build)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: 'https://preview.eagleeyeafrica.com'
          NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'test-anon-key'
          SUPABASE_SERVICE_ROLE_KEY: 'test-service-role-key'

