name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Lint, Bare Links & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run code quality, bare href & sitemap route checks
        run: npm run check

      - name: Run unit test suite
        run: npm test

      - name: Verify backup integrity (when storage secrets are configured)
        run: node scripts/verify-backup.mjs --mode=verify --batch=10
        continue-on-error: true

      - name: Dry-run production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: 'https://preview.eagleeyeafrica.com'
          NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'test-anon-key'
          SUPABASE_SERVICE_ROLE_KEY: 'test-service-role-key'
